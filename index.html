<!DOCTYPE html>
<html>
<head>
    <title>Cool Apps built with Base44</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px;
        }
        h1 { 
            text-align: center; 
            font-size: 2.5em; 
            margin-top: 1.5em; 
            background: linear-gradient(90deg, #6366f1, #06b6d4); 
            -webkit-background-clip: text; 
            color: transparent; 
        }
        .search-container {
            text-align: center;
            margin: 2em 0;
        }
        .search-input {
            width: 300px;
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            border-color: #6366f1;
        }
        .stats {
            text-align: center;
            margin: 1em 0;
            color: #64748b;
            font-size: 1.1em;
        }
        table { 
            margin: 2em auto; 
            border-collapse: collapse; 
            width: 90%; 
            background: rgba(255,255,255,0.8); 
            border-radius: 16px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.08); 
            overflow: hidden; 
        }
        th, td { 
            padding: 1em; 
            border-bottom: 1px solid #e5e7eb; 
            text-align: left; 
        }
        th { 
            background: #f1f5f9; 
            font-size: 1.1em; 
        }
        tr:hover { 
            background: #f0f9ff; 
        }
        a { 
            color: #2563eb; 
            text-decoration: none; 
        }
        a:hover { 
            text-decoration: underline; 
        }
        .pagination {
            text-align: center;
            margin: 2em 0;
        }
        .pagination button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 0 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .pagination button:hover {
            background: #4f46e5;
        }
        .pagination button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .pagination .current-page {
            background: #1e40af;
        }
        .footer { 
            text-align: center; 
            margin: 2em 0 1em 0; 
            color: #64748b; 
            font-size: 1.1em; 
        }
        .footer a { 
            color: #6366f1; 
            font-weight: bold; 
        }
        .footer .heart { 
            color: #ef4444; 
            animation: pulse 1.2s infinite alternate; 
        }
        @keyframes pulse { 
            from { transform: scale(1); } 
            to { transform: scale(1.2); } 
        }
        .loading {
            text-align: center;
            margin: 2em 0;
            color: #64748b;
        }
        .no-results {
            text-align: center;
            margin: 2em 0;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Cool Apps built with Base44</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search apps by title, description, or URL..." onkeyup="filterTable()">
    </div>
    
    <div class="stats" id="stats">
        Loading...
    </div>
    
    <table id="appsTable">
        <thead>
            <tr>
                <th>#</th>
                <th>URL</th>
                <th>Title</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" class="loading">Loading apps...</td></tr>
        </tbody>
    </table>
    
    <div class="pagination" id="pagination" style="display: none;">
        <button onclick="previousPage()" id="prevBtn">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button onclick="nextPage()" id="nextBtn">Next</button>
    </div>
    
    <div class="footer">
        Created with <span class="heart">♥</span> by <a href="https://github.com/TheSnowGuru" target="_blank">@TheSnowGuru</a>
    </div>

    <script>
        let allApps = [];
        let filteredApps = [];
        let currentPage = 1;
        const itemsPerPage = 100;

        // Load data from JSON file
        async function loadApps() {
            try {
                const response = await fetch('subdomains_data.json');
                const data = await response.json();
                
                // Convert to array and filter for app-- pattern
                allApps = Object.entries(data)
                    .filter(([subdomain, info]) => subdomain.startsWith('app--'))
                    .map(([subdomain, info], index) => ({
                        id: index + 1,
                        url: info.url,
                        title: info.title || 'No title',
                        description: info.description || 'No description'
                    }))
                    .sort((a, b) => a.title.localeCompare(b.title));
                
                filteredApps = [...allApps];
                updateStats();
                displayCurrentPage();
                showPagination();
            } catch (error) {
                console.error('Error loading apps:', error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" class="no-results">Error loading apps. Please try again later.</td></tr>';
            }
        }

        function updateStats() {
            const totalApps = allApps.length;
            const filteredCount = filteredApps.length;
            const totalPages = Math.ceil(filteredCount / itemsPerPage);
            
            let statsText = `Showing ${filteredCount} of ${totalApps} apps`;
            if (filteredCount !== totalApps) {
                statsText += ` (filtered)`;
            }
            if (totalPages > 1) {
                statsText += ` • Page ${currentPage} of ${totalPages}`;
            }
            
            document.getElementById('stats').textContent = statsText;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredApps = allApps.filter(app => 
                app.title.toLowerCase().includes(searchTerm) ||
                app.description.toLowerCase().includes(searchTerm) ||
                app.url.toLowerCase().includes(searchTerm)
            );
            
            currentPage = 1;
            updateStats();
            displayCurrentPage();
            showPagination();
        }

        function displayCurrentPage() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageApps = filteredApps.slice(startIndex, endIndex);
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (pageApps.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-results">No apps found matching your search.</td></tr>';
                return;
            }
            
            pageApps.forEach((app, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${startIndex + index + 1}</td>
                    <td><a href="${app.url}" target="_blank">${app.url}</a></td>
                    <td>${app.title}</td>
                    <td>${app.description}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function showPagination() {
            const totalPages = Math.ceil(filteredApps.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'block';
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                displayCurrentPage();
                updateStats();
                showPagination();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredApps.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayCurrentPage();
                updateStats();
                showPagination();
            }
        }

        // Load apps when page loads
        document.addEventListener('DOMContentLoaded', loadApps);
    </script>
</body>
</html>
