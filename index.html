    <html>
    <head>
        <title>Cool Apps built with Base44</title>
        <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
        <style>
            body { background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); font-family: 'Inter', sans-serif; margin: 0; }
            h1 { text-align: center; font-size: 2.5em; margin-top: 1.5em; background: linear-gradient(90deg, #6366f1, #06b6d4); -webkit-background-clip: text; color: transparent; }
            table { margin: 2em auto; border-collapse: collapse; width: 90%; background: rgba(255,255,255,0.8); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
            th, td { padding: 1em; border-bottom: 1px solid #e5e7eb; text-align: left; }
            th { background: #f1f5f9; font-size: 1.1em; }
            tr:hover { background: #f0f9ff; }
            a { color: #2563eb; text-decoration: none; }
            a:hover { text-decoration: underline; }
            .footer { text-align: center; margin: 2em 0 1em 0; color: #64748b; font-size: 1.1em; }
            .footer a { color: #6366f1; font-weight: bold; }
            .footer .heart { color: #ef4444; animation: pulse 1.2s infinite alternate; }
            @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }
        </style>
    </head>
    <body>
        <h1>Cool Apps built with Base44</h1>
        <input type="text" id="searchInput" placeholder="Search apps..." style="display:block;margin:1em auto;width:60%;padding:0.7em;font-size:1.1em;border-radius:8px;border:1px solid #cbd5e1;">
        <table id="appsTable">
            <thead>
                <tr><th>#</th><th>URL</th><th>Title</th><th>Description</th></tr>
            </thead>
            <tbody>
                <!-- Dynamic rows go here -->
            </tbody>
        </table>
        <div id="pagination" style="text-align:center;margin:1em 0;"></div>
        <div class="footer">
            Created with <span class="heart">♥</span> by <a href="https://github.com/TheSnowGuru" target="_blank">@TheSnowGuru</a>
        </div>
        <script>
        const PAGE_SIZE = 25;
        let allApps = [];
        let filteredApps = [];
        let currentPage = 1;
        let lastLoaded = new Set();

        function renderTable(page=1) {
            const tbody = document.querySelector('#appsTable tbody');
            tbody.innerHTML = '';
            const start = (page-1)*PAGE_SIZE;
            const end = start+PAGE_SIZE;
            const pageApps = filteredApps.slice(start, end);
            pageApps.forEach((app, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${start+i+1}</td><td><a href="${app.url}" target="_blank">${app.url}</a></td><td>${app.title}</td><td>${app.description}</td>`;
                tbody.appendChild(tr);
            });
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredApps.length / PAGE_SIZE);
            const pagDiv = document.getElementById('pagination');
            pagDiv.innerHTML = '';
            if (totalPages <= 1) return;
            for (let i=1; i<=totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.style.margin = '0 4px';
                btn.disabled = (i === currentPage);
                btn.onclick = () => { currentPage = i; renderTable(i); };
                pagDiv.appendChild(btn);
            }
        }

        function filterApps() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filteredApps = allApps.filter(app =>
                app.url.toLowerCase().includes(q) ||
                app.title.toLowerCase().includes(q) ||
                app.description.toLowerCase().includes(q)
            );
            currentPage = 1;
            renderTable(1);
        }

        fetch('subdomains_data.json')
            .then(r => r.json())
            .then(data => {
                // Convert object to array
                allApps = Object.values(data);
                // Print new findings to console
                allApps.forEach(app => {
                    if (!lastLoaded.has(app.url)) {
                        console.log('New app found:', app.url, app.title, app.description);
                        lastLoaded.add(app.url);
                    }
                });
                filteredApps = allApps;
                renderTable();
            });
        document.getElementById('searchInput').addEventListener('input', filterApps);
        </script>
    </body>
    </html>
