<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cool Apps built with Base44</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); font-family: 'Inter', sans-serif; margin: 0; }
        h1 { text-align: center; font-size: 2.5em; margin-top: 1.5em; background: linear-gradient(90deg, #6366f1, #06b6d4); -webkit-background-clip: text; color: transparent; }
        .search-container { text-align: center; margin: 2em 0 1em 0; }
        .search-box { padding: 0.7em 1em; font-size: 1.1em; border-radius: 8px; border: 1px solid #cbd5e1; width: 320px; max-width: 90vw; }
        table { margin: 2em auto; border-collapse: collapse; width: 90%; background: rgba(255,255,255,0.8); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
        th, td { padding: 1em; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f1f5f9; font-size: 1.1em; }
        tr:hover { background: #f0f9ff; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .footer { text-align: center; margin: 2em 0 1em 0; color: #64748b; font-size: 1.1em; }
        .footer a { color: #6366f1; font-weight: bold; }
        .footer .heart { color: #ef4444; animation: pulse 1.2s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }
        .pagination { text-align: center; margin: 1em 0; }
        .pagination button { margin: 0 0.3em; padding: 0.5em 1.2em; border-radius: 6px; border: 1px solid #cbd5e1; background: #f1f5f9; color: #333; font-size: 1em; cursor: pointer; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Cool Apps built with Base44</h1>
    <div class="search-container">
        <input type="text" id="searchBox" class="search-box" placeholder="Search by keyword...">
    </div>
    <div class="pagination" id="pagination"></div>
    <table id="subdomainTable">
        <thead>
            <tr><th>#</th><th>URL</th><th>Title</th><th>Description</th></tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
        </tbody>
    </table>
    <div class="pagination" id="pagination-bottom"></div>
    <div class="footer">
        Created with <span class="heart">♥</span> by <a href="https://github.com/TheSnowGuru" target="_blank">@TheSnowGuru</a>
    </div>
    <script>
    let subdomains = [];
    let filtered = [];
    let currentPage = 1;
    const perPage = 100;

    function renderTable(page = 1) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        const start = (page - 1) * perPage;
        const end = start + perPage;
        let count = start;
        const pageData = filtered.slice(start, end);
        pageData.forEach((item, idx) => {
            const { url, title, description } = item;
            count++;
            const row = `<tr><td>${count}</td><td><a href="${url}" target="_blank">${url}</a></td><td>${title}</td><td>${description}</td></tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });
        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No results found.</td></tr>';
        }
        renderPagination(page);
    }

    function renderPagination(page) {
        const totalPages = Math.ceil(filtered.length / perPage) || 1;
        const pagDivs = [document.getElementById('pagination'), document.getElementById('pagination-bottom')];
        pagDivs.forEach(pagDiv => {
            pagDiv.innerHTML = '';
            pagDiv.innerHTML += `<button onclick="gotoPage(1)" ${page === 1 ? 'disabled' : ''}>First</button>`;
            pagDiv.innerHTML += `<button onclick="gotoPage(${page-1})" ${page === 1 ? 'disabled' : ''}>Prev</button>`;
            pagDiv.innerHTML += `<span> Page ${page} of ${totalPages} </span>`;
            pagDiv.innerHTML += `<button onclick="gotoPage(${page+1})" ${page === totalPages ? 'disabled' : ''}>Next</button>`;
            pagDiv.innerHTML += `<button onclick="gotoPage(${totalPages})" ${page === totalPages ? 'disabled' : ''}>Last</button>`;
        });
    }

    function gotoPage(page) {
        const totalPages = Math.ceil(filtered.length / perPage) || 1;
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;
        renderTable(currentPage);
    }

    function filterData(filter = "") {
        filter = filter.trim().toLowerCase();
        filtered = subdomains.filter(item =>
            (!filter ||
                item.url.toLowerCase().includes(filter) ||
                (item.title && item.title.toLowerCase().includes(filter)) ||
                (item.description && item.description.toLowerCase().includes(filter))
            )
        );
        currentPage = 1;
        renderTable(currentPage);
    }

    fetch('subdomains_data.json')
        .then(resp => resp.json())
        .then(data => {
            subdomains = Object.values(data).filter(item =>
                item.title && ![
                    "Base44 - Build useful apps",
                    "Base44",
                    "Welcome to Base44",
                    "Base44 App",
                    "Base44 - App",
                    "Base44 - Home"
                ].includes(item.title)
            );
            filterData();
        });
    document.getElementById('searchBox').addEventListener('input', function() {
        filterData(this.value);
    });
    </script>
</body>
</html>
